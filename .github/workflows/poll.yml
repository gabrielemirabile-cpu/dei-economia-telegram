name: Avvisi Economia → Telegram

on:
  schedule:
    - cron: "*/5 * * * *"   # ogni 5 minuti (minimo consentito da GitHub)
  workflow_dispatch:         # permette di lanciarlo a mano dalla scheda Actions

permissions:
  contents: write            # serve per salvare seen.json nel repo

concurrency:
  group: poll
  cancel-in-progress: false  # due esecuzioni non si accavallano mai

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla nuovi avvisi e inviali su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python bot.py

      - name: Salva lo stato (avvisi già inviati)
        if: always()
        run: |
          if git diff --quiet -- seen.json; then
            echo "Nessuna novità, niente da salvare."
            exit 0
          fi
          git config user.name "dei-bot"
          git config user.email "dei-bot@users.noreply.github.com"
          git add seen.json
          git commit -m "Aggiorna elenco avvisi inviati"
          git pull --rebase
          git push
